<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stageopdracht JDSystems - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">JDSystems</div>
        <ul>
            <li><a href="index.html">Startpagina</a></li>
            <li><a href="gegevens.html">Informatie</a></li>
            <li><a href="contact.html" class="contact, active">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="contact_section">
            <form class="contact_form">
    
                <label for="voornaam">Voornaam</label>
                <input type="text" id="voornaam" name="Voornaam" placeholder="Jouw voornaam..." required>
                
                <label for="achternaam">Achternaam</label>
                <input type="text" id="achternaam" name="Achternaam" placeholder="Jouw achternaam..." required>
    
                <label for="email">Email</label>
                <input type="email" id="email" name="Email" placeholder="Jouw email-adress" required>
    
                <label for="telefoonnummer">Telefoonnummer</label>
                <input type="tel" id="telefoonnummer" name="Telefoonnummer" placeholder="Jouw telefoonnummer...">
    
                <label for="onderwerp">Onderwerp</label>
                <textarea id="onderwerp" name="onderwerp" placeholder="Schrijf hier je bericht..."></textarea>
    
                <input type="submit" value="Versturen">
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 JDSystems — Alle rechten voorbehouden.</p>
    </footer>
</body>
</html>
